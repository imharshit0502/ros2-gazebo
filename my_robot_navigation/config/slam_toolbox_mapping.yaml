# SLAM Toolbox parameters for mapping the retail store.
# Based on slam_toolbox's mapper_params_online_async.yaml. Lines marked  # <-- CHANGED
# differ from the default; everything else is the stock value.
#
# HOW SLAM TOOLBOX WORKS (short version)
#   * Wheel odometry (odom -> base_footprint TF, from the Gazebo DiffDrive plugin)
#     gives a rough guess of how the robot moved. It slowly drifts.
#   * Every time the robot moves a little, the newest /scan is "scan-matched"
#     against the map built so far. That corrects the odometry guess.
#   * The correction is published as the TF  map -> odom.  So the full chain is
#       map -> odom -> base_footprint -> base_link -> lidar_link
#   * When the robot returns to a place it has seen before, "loop closure"
#     snaps the whole pose graph back into shape, removing accumulated drift.

slam_toolbox:
  ros__parameters:
    use_sim_time: true                     # <-- CHANGED: follow Gazebo's /clock

    # Plugin params (graph optimiser used for loop closure)
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ROS Parameters - frame names must match our URDF / DiffDrive plugin
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    use_map_saver: true
    mode: mapping

    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02
    map_update_interval: 2.0               # <-- CHANGED (5.0): RViz map refreshes faster, nicer to watch live
    resolution: 0.05                       # 5 cm per map cell
    restamp_tf: false
    min_laser_range: 0.0
    max_laser_range: 20.0                  # matches the LiDAR <range><max> in lidar.xacro
    minimum_time_interval: 0.5
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    enable_interactive_mode: true

    # General Parameters
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.3           # <-- CHANGED (0.5): add a scan every 30 cm ...
    minimum_travel_heading: 0.3            # <-- CHANGED (0.5): ... or every ~17 deg of turning. Aisles are narrow, more scans = sharper shelf edges
    check_min_dist_and_heading_precisely: false
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    # --- Loop closure: made MUCH stricter for a supermarket (all <-- CHANGED) ---
    # Every aisle looks identical to a 2D laser (two parallel shelf faces), so the
    # default settings happily "close a loop" between aisle 4 and aisle 5 and shift
    # the robot by one aisle width (3.58 m). This is called perceptual aliasing.
    # Simulated wheel odometry drifts only a few cm, so we only accept loop
    # closures close to where odometry says we are, and only very confident ones.
    loop_search_maximum_distance: 1.0      # <-- CHANGED (3.0): aisles are 3.58 m apart, never search that far
    do_loop_closing: true
    loop_match_minimum_chain_size: 15      # <-- CHANGED (10): need a longer run of matching scans
    loop_match_maximum_variance_coarse: 1.0  # <-- CHANGED (3.0)
    loop_match_minimum_response_coarse: 0.55 # <-- CHANGED (0.35): match must be a stronger fit
    loop_match_minimum_response_fine: 0.65   # <-- CHANGED (0.45)

    # Correlation Parameters - Correlation Parameters
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    # Correlation Parameters - Loop Closure Parameters
    loop_search_space_dimension: 3.0         # <-- CHANGED (8.0): smaller window, cannot reach the neighbouring aisle
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # Scan Matcher Parameters
    # Smaller variance = scan matcher is penalised more for disagreeing with odometry.
    # Our odometry is very good in simulation, so trust it more.  (<-- CHANGED both)
    distance_variance_penalty: 0.3
    angle_variance_penalty: 0.5

    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
    min_pass_through: 2
    occupancy_threshold: 0.1
